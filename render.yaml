services:
  - type: web
    name: chatbot-rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: chatbot_rag
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_CHAT_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_SECRET_KEY
        generateValue: true
      - key: EMBEDDING_PROVIDER
        value: local_mock
      - key: VECTOR_STORE_TYPE
        value: local
      - key: FRONTEND_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
